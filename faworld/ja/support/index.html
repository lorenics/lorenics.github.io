<!doctype html>
<html lang="ja" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>お支払いの相談 | FA World by Lorenics</title>
<meta name="theme-color" content="#0a0e13">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preload" as="font" type="font/woff2" crossorigin href="../../assets/fonts/zen-900.woff2">
<link rel="stylesheet" href="../../assets/support.css">
</head>
<body>
<div class="bg" style="background-image:url('../../assets/img/ja_hero.webp')"></div>
<header class="top"><a class="brand" href="../">FA World<small>by Lorenics</small></a><a class="lang" href="../../support/" lang="en" hreflang="en">English</a></header>
<main>
<section class="card" id="ask">
<p class="eye">お支払いの相談</p>
<h1><span class="ph">返金・解約・請求の</span> <span class="ph">ご相談</span></h1>
<p class="lead"><span class="ph">返金のご希望</span> <span class="ph">解約できない時</span> <span class="ph">請求についての疑問</span> <span class="ph">苦情を</span> <span class="ph">受け付けています</span></p>
<form id="fbf" novalidate data-msg="{&quot;empty&quot;: &quot;内容を書いてください&quot;, &quot;email&quot;: &quot;メールアドレスを確かめてください&quot;, &quot;long&quot;: &quot;4,000字までにしてください&quot;, &quot;wait&quot;: &quot;送っています&quot;, &quot;busy&quot;: &quot;今は連絡が混み合っています 時間をおいて もう一度送ってください&quot;, &quot;net&quot;: &quot;送れませんでした もう一度試してください&quot;, &quot;need&quot;: &quot;メールアドレスを入れてください&quot;}">
<fieldset><legend>どんな内容ですか</legend><div class="kinds"><label><input type="radio" name="kind" value="refund" checked><span>返金</span></label><label><input type="radio" name="kind" value="cancel"><span>解約</span></label><label><input type="radio" name="kind" value="billing"><span>請求</span></label><label><input type="radio" name="kind" value="complaint"><span>苦情</span></label></div></fieldset>
<div class="fld"><label for="fm">内容</label>
<textarea id="fm" name="message" maxlength="4000" placeholder="いつ 何が起きたか（例：解約したのに請求が来た）"></textarea></div>
<div class="fld"><label for="fe">申し込みに使ったメールアドレス<small>必ず入れてください</small></label>
<input id="fe" name="email" type="email" autocomplete="email" spellcheck="false" required placeholder="you@example.com"></div>
<div class="hp" aria-hidden="true"><label for="fs">Website</label><input id="fs" name="site" type="text" tabindex="-1" autocomplete="off"></div>
<ul class="hints"><li><span class="ph">3営業日以内に</span> <span class="ph">メールで返事します</span></li><li><span class="ph">カードの番号と</span> <span class="ph">会員のキーは</span> <span class="ph">書かないでください</span></li><li><span class="ph">解約は</span> <span class="ph">ご自身で</span> <span class="ph">いつでもできます</span> <a href="../legal/#refunds">解約のやり方を見る</a></li></ul>
<p class="msg" id="fmsg" role="status" aria-live="polite"></p>
<button class="go" type="submit">送る</button>
</form>
<p class="more"><span class="ph">送った内容は</span> <span class="ph">購入の確認と返事のために使います</span><br><a class="lg" href="../legal/">規約と表記</a></p>
</section>
<section class="card" id="done" hidden>
<p class="eye ok">送りました</p>
<h1>ありがとうございます</h1>
<p class="lead"><span class="ph">3営業日以内に</span> <span class="ph">メールで返事します</span></p>
<div class="act"><a class="go" href="../">FA World へ戻る</a></div>
<div class="act2"><button class="again" id="again" type="button">もう1件送る</button></div>
</section>
</main>
<script src="../../assets/support.js" defer></script>
</body>
</html>
