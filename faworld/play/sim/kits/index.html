<meta name="viewport" content="width=device-width,initial-scale=1">
<title>訓練機コーナー</title>
<link rel="stylesheet" href="../../fai/fonts/zen.css">
<script type="importmap">
{ "imports": {
  "three": "../vendor/three.module.min.js",
  "three/addons/controls/OrbitControls.js": "../vendor/OrbitControls.js",
  "three/addons/environments/RoomEnvironment.js": "../vendor/RoomEnvironment.js",
  "three/addons/geometries/RoundedBoxGeometry.js": "../vendor/RoundedBoxGeometry.js",
  "three/addons/renderers/CSS2DRenderer.js": "../../lib/vendor/three/examples/jsm/renderers/CSS2DRenderer.js"

<style>
:root { --ink:#0f172a; --sub:#334155; --line:#cbd5e1; --bg:#eef2f6; --navy:#0f2a4a; --accent:#1d4ed8; --on:#15803d; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Zen Kaku Gothic New", system-ui, sans-serif; font-size: 15px; line-height: 1.6; }
#app { display: grid; grid-template-columns: 1fr 400px; height: 100vh; }
#view { position: relative; overflow: hidden; background: #e6eaee; touch-action: none; }
#view canvas { display: block; width: 100%; height: 100%; }
#view .labels { position: absolute; inset: 0; pointer-events: none; }
.plabel { background: rgba(11,18,32,.88); color: #fff; font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; border: 1px solid #fff; }
#alarm { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: calc(100% - 32px); background: #b91c1c; color: #fff; font-weight: 900; font-size: 14px; line-height: 1.5; padding: 6px 14px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.3); white-space: pre-line; text-align: center; pointer-events: none; z-index: 4; }
#alarm:empty { display: none; }
#view.fai-tr #alarm { left: calc(356px + (100% - 356px) / 2); max-width: calc(100% - 372px); }
.viewbtns { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; z-index: 4; }
.viewbtns button { font: inherit; font-size: 13px; font-weight: 900; border: 0; border-radius: 8px; background: #1e293b; color: #fff; padding: 7px 11px; cursor: pointer; }
.viewbtns button.on { background: var(--accent); }
#side { overflow: auto; background: #fff; border-left: 1px solid var(--line); padding: 12px 14px 20px; }
#side h2 { margin: 0; font-size: 18px; font-weight: 900; line-height: 1.4; }
#side .desc { margin: 4px 0 8px; font-size: 13px; color: var(--sub); font-weight: 500; }
#kitPickSide { font: inherit; font-size: 13px; font-weight: 900; border: 2px solid var(--navy); background: #fff; color: var(--navy); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
#status { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; padding: 8px 10px; border-radius: 8px; font-size: 14px; font-weight: 800; border: 2px solid; line-height: 1.45; }
#status .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
#status.run { background: #dcfce7; color: #14532d; border-color: #16a34a; } #status.run .dot { background: #16a34a; }
#status.stop { background: #fef9c3; color: #713f12; border-color: #ca8a04; } #status.stop .dot { background: #eab308; }
#status.fault { background: #fee2e2; color: #7f1d1d; border-color: #dc2626; } #status.fault .dot { background: #dc2626; }
#ops { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
#ops button { font: inherit; border: 0; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 900; padding: 8px 4px 6px; cursor: pointer; line-height: 1.25; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
#ops button small { display: block; font-size: 11px; font-weight: 700; opacity: .9; }
#pb-start { background: #15803d; } #pb-stop { background: #b91c1c; } #pb-reset { background: #334155; }
#ops button:active { transform: translateY(2px); box-shadow: none; }
#tabs { display: flex; gap: 4px; margin-top: 12px; border-bottom: 2px solid var(--line); }
#tabs button { font: inherit; font-size: 14px; font-weight: 900; border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--sub); border-bottom: 3px solid transparent; margin-bottom: -2px; }
#tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.note { font-size: 13px; color: var(--sub); font-weight: 600; margin: 6px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td { padding: 5px 4px; border-top: 1px solid #e2e8f0; vertical-align: middle; font-weight: 600; }
td.a { font-family: ui-monospace, Consolas, monospace; font-weight: 800; width: 48px; color: var(--navy); }
td:last-child { width: 50px; text-align: right; }
.b { display: inline-block; min-width: 40px; text-align: center; padding: 1px 6px; border-radius: 6px; background: #e5e7eb; color: #1f2937; font-weight: 800; font-size: 12px; }
tr.on .b { background: #16a34a; color: #fff; }
tr.sec td { background: #f1f5f9; font-weight: 900; color: var(--navy); }
#ladWrap .follow { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--navy); margin: 4px 0; }
#lad { position: relative; border: 2px solid #9aa6b2; border-radius: 8px; background: #fff; max-height: 62vh; overflow: auto; }
#lad .lsec { background: var(--navy); color: #fff; font-size: 14px; font-weight: 800; padding: 4px 10px; }
#lad .lcmt { font-size: 13px; font-weight: 800; color: #14532d; padding: 6px 8px 0 10px; line-height: 1.4; }
#lad .rung { border-bottom: 1px solid #d5dce3; }
#lad .rung.cur { background: #fde68a; box-shadow: inset 6px 0 0 #b45309; }
#lad .lsvg { display: block; width: 100%; height: auto; }
#lad .lend { display: flex; gap: 14px; padding: 8px 10px; font: 800 14px ui-monospace, Consolas, monospace; color: var(--navy); }
#lad text.ld { font: 800 14.5px ui-monospace, Consolas, monospace; fill: #0b1220; text-anchor: middle; }
#lad text.lc { font-size: 14.5px; font-weight: 800; fill: #1f2937; text-anchor: middle; }
#lad text.sn { font: 800 14.5px ui-monospace, Consolas, monospace; fill: var(--navy); }
#lad text.kt { font: 800 14.5px ui-monospace, Consolas, monospace; fill: #0b1220; text-anchor: middle; }
#lad .w { stroke: #4b5563; stroke-width: 2; }
#lad .w.on { stroke: #1d4ed8; stroke-width: 5; }
#lad .rail { stroke: #0b1220; stroke-width: 3; }
#lad .cb, #lad .kb { stroke: #0b1220; stroke-width: 3; fill: none; }
#lad .cf, #lad .kf { fill: transparent; }
#lad .cf.on, #lad .kf.on { fill: #2563eb; }
/* 訓練機をえらぶ窓（3Dの上に重ねる） */
#kitChooser { position: absolute; inset: 0; z-index: 8; background: rgba(15,23,42,.72); display: flex; align-items: flex-start; justify-content: center; padding: 18px; overflow: auto; }
#kitChooser[hidden] { display: none; }
#kitChooser .kc { background: #fff; border-radius: 14px; width: min(1000px, 100%); padding: 16px 18px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
#kitChooser .kc-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
#kitChooser h2 { margin: 0; font-size: 20px; font-weight: 900; }
#kitChooser .kc-sub { margin: 4px 0 12px; font-size: 13px; font-weight: 600; color: var(--sub); }
#kitChooser .kc-x { font: inherit; font-size: 13px; font-weight: 900; border: 0; border-radius: 8px; background: #e5e7eb; color: var(--ink); padding: 6px 12px; cursor: pointer; white-space: nowrap; }
#kitChooser .kc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
#kitChooser .kc-card { font: inherit; text-align: left; border: 2px solid #cbd5e1; background: #f8fafc; border-radius: 10px; padding: 7px 10px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: center; color: var(--ink); }
#kitChooser .kc-card:hover, #kitChooser .kc-card:focus-visible { border-color: var(--accent); background: #eff6ff; }
#kitChooser .kc-card.cur { border-color: var(--navy); background: #e0e7ff; }
#kitChooser .kc-n { font-size: 14px; font-weight: 900; line-height: 1.35; }
#kitChooser .kc-lv { font-size: 12px; color: #92400e; font-weight: 800; letter-spacing: .05em; }
#kitChooser .kc-t { grid-column: 1 / 3; font-size: 12px; font-weight: 600; color: var(--sub); }
#kitChooser .kc-b { font-size: 12px; font-weight: 800; color: var(--on); white-space: nowrap; }
#loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-weight: 900; color: var(--sub); z-index: 2; }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="loading">読み込み中</div>
    <div id="alarm"></div>
    <div class="viewbtns"><button type="button" id="bXray">中を透かす</button><button type="button" id="bLabel">部品名</button><button type="button" id="bView">視点を戻す</button></div>
    <div id="kitChooser" hidden><div class="kc" role="dialog" aria-label="訓練機をえらぶ">
      <div class="kc-hd"><div><h2>訓練機をえらぶ</h2><p class="kc-sub">31台の小さな設備です。どの台もラダーで動き、故障を1つ仕込んだ問題が1問ずつあります。</p></div><button type="button" class="kc-x" id="kitChooserClose">閉じる</button></div>
      <div class="kc-grid" id="kitGrid"></div>
    </div></div>
  </div>
  <aside id="side">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><h2 id="kitName">訓練機</h2><button type="button" id="kitPickSide">台をえらぶ</button></div>
    <p class="desc" id="kitDesc"></p>
    <div id="status" class="stop"><span class="dot"></span><span id="stxt">読み込み中</span></div>
    <div id="ops">
      <button type="button" id="pb-start">起動<small>X010</small></button>
      <button type="button" id="pb-stop">停止<small>X011</small></button>
      <button type="button" id="pb-reset">リセット<small>X012</small></button>
    </div>
    <p class="note">停止は、今のサイクルを終えてから止まります（定常停止）。異常で止まったら、リセットで異常を消してから起動します。</p>
    <div id="tabs"><button type="button" data-tab="io" class="on">I/O</button><button type="button" data-tab="lad">ラダー</button></div>
    <div id="ioWrap"><p class="note">X は入力（センサ・スイッチ）、Y は出力（モーター・弁など）。緑の ON が今入っている信号です。</p><table id="io"></table></div>
    <div id="ladWrap" hidden><p class="note">3Dはこのラダーの出力（Y）で動きます。青い所に電気が通っています。濃い黄色の行が今の工程です。</p>
      <label class="follow"><input type="checkbox" id="lFollow" checked>今の工程に合わせて動かす</label><div id="lad"></div></div>
  </aside>
</div>
<script type="module" src="./fai_kits.js"></script>
</body>
</html>
