<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PLC連動 3Dライン</title>
<style>
  :root{
    --bg:#0f1419; --panel:#ffffff; --ink:#111827; --sub:#374151; --line:#d1d5db;
    --on:#16a34a; --off:#9ca3af; --warn:#dc2626; --accent:#1d4ed8; --amber:#d97706;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Zen Kaku Gothic New",sans-serif;font-weight:600}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#111827;color:#fff;flex-wrap:wrap}
  #topbar h1{font-size:15px;font-weight:800;letter-spacing:.02em;margin-right:auto}
  .pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#374151;color:#fff;white-space:nowrap}
  .pill.ok{background:var(--on)} .pill.ng{background:var(--warn)} .pill.wait{background:var(--amber)}
  .modes{display:flex;gap:4px;background:#1f2937;border-radius:10px;padding:3px}
  .modes button{border:0;background:transparent;color:#d1d5db;font:inherit;font-size:12px;font-weight:800;padding:6px 10px;border-radius:8px;cursor:pointer}
  .modes button.sel{background:#fff;color:#111827}
  #main{flex:1;display:flex;min-height:0}
  #view{flex:1;position:relative;min-width:0;min-height:0}
  #view canvas{display:block;width:100%;height:100%;touch-action:none}
  #alarm{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--warn);color:#fff;
    font-weight:900;font-size:15px;padding:8px 16px;border-radius:10px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  #side{width:360px;background:var(--panel);display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}
  .tabs{display:flex;border-bottom:2px solid var(--line)}
  .tabs button{flex:1;border:0;background:#f3f4f6;font:inherit;font-size:14px;font-weight:800;padding:10px 4px;color:var(--sub);cursor:pointer}
  .tabs button.sel{background:#fff;color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
  .tabbody{flex:1;overflow:auto;padding:12px;display:none}
  .tabbody.sel{display:block}
  .pbrow{display:flex;gap:10px;margin-bottom:12px}
  .pb{flex:1;border:0;border-radius:14px;padding:14px 6px;font:inherit;font-size:17px;font-weight:900;color:#fff;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.25);user-select:none;-webkit-user-select:none;touch-action:none}
  .pb small{display:block;font-size:12px;font-weight:800;opacity:.95;margin-top:2px}
  .pb:active,.pb.down{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .pb.start{background:#15803d} .pb.stop{background:#b91c1c} .pb.reset{background:#374151;font-size:15px}
  .lamps{display:flex;gap:10px;margin-bottom:12px}
  .lamp{flex:1;display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--off);flex:none;border:2px solid rgba(0,0,0,.15)}
  .dot.on{background:var(--on)} .dot.red.on{background:var(--warn)}
  .counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .count{border-radius:12px;padding:8px;text-align:center;background:#f3f4f6}
  .count b{display:block;font-size:24px;font-weight:900}
  .count span{font-size:12px;color:var(--sub)}
  .count.ok b{color:var(--on)} .count.ng b{color:var(--amber)} .count.jam b{color:var(--warn)}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
  .row label{min-width:90px;color:var(--sub)}
  .row input[type=range]{flex:1}
  .note{font-size:12.5px;line-height:1.7;color:var(--sub);font-weight:600}
  .note b{color:var(--ink)}
  .iohead{font-size:13px;font-weight:900;color:var(--sub);margin:4px 0 6px}
  .io{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #eef0f3;font-size:14px}
  .io .dev{font-family:ui-monospace,"Consolas",monospace;font-weight:900;font-size:15px;min-width:52px}
  .io .nm{flex:1}
  .io.clickable{cursor:pointer;border-radius:8px}
  .io.clickable:hover{background:#f3f4f6}
  table.map{width:100%;border-collapse:collapse;font-size:13px}
  table.map th,table.map td{border-bottom:1px solid #eef0f3;padding:6px 4px;text-align:left}
  table.map th{color:var(--sub);font-size:12px}
  table.map td.dev{font-family:ui-monospace,"Consolas",monospace;font-weight:900}
  .conn{display:flex;gap:6px;margin:8px 0}
  .conn input{flex:1;font:inherit;font-size:13px;padding:8px;border:2px solid var(--line);border-radius:8px}
  .conn button{font:inherit;font-size:13px;font-weight:800;border:0;border-radius:8px;background:var(--accent);color:#fff;padding:8px 12px;cursor:pointer}
  @media (max-width: 820px){
    #main{flex-direction:column}
    #side{width:auto;height:46%;border-left:0;border-top:1px solid var(--line)}
    #topbar h1{font-size:14px;width:100%}
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>PLC連動 3Dライン</h1>
    <a href="index.html" style="color:#93c5fd;font-size:12px;font-weight:800;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:5px 8px">ラダーエディタ</a>
    <a href="line2.html" style="color:#93c5fd;font-size:12px;font-weight:800;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:5px 8px">ライン2へ</a>
    <div class="modes" id="modes">
      <button data-mode="demo">内蔵デモ</button>
      <button data-mode="manual">手動</button>
    </div>
    <span class="pill" id="status">起動中</span>
  </div>
  <div id="main">
