<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ブラウザPLC ラダーエディタ ＋ 3Dライン</title>
<style>
  :root{ --ink:#111827; --sub:#374151; --line:#d1d5db; --on:#16a34a; --warn:#dc2626; --accent:#1d4ed8; --mon:#2563eb; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#e5e7eb;color:var(--ink);
    font-family:"Zen Kaku Gothic New",sans-serif;font-weight:600}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #top{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#111827;color:#fff;flex-wrap:wrap}
  #top h1{font-size:14px;font-weight:900;margin-right:6px}
  #top select,#top button{font:inherit;font-size:12.5px;font-weight:800;border:0;border-radius:8px;padding:7px 10px;cursor:pointer}
  #top select{background:#1f2937;color:#fff}
  .tb{background:#374151;color:#fff}
  .tb.primary{background:#2563eb} .tb.run{background:#16a34a} .tb.stop{background:#b91c1c} .tb.on{background:#f59e0b;color:#111}
  #top a.tb{font-size:12.5px;font-weight:800;border-radius:8px;padding:7px 10px;color:#fff;display:inline-block}
  #bAttach{font:inherit;font-size:12.5px;font-weight:800;border:0;border-radius:8px;padding:6px 12px;color:#fff;cursor:pointer}
  .sp{flex:1}
  #plcState{font-size:12px;font-weight:900;padding:5px 10px;border-radius:999px;background:#4b5563}
  #plcState.run{background:#16a34a} #plcState.stop{background:#b91c1c}
  #main{flex:1;display:flex;min-height:0}
  #edPane{flex:1.7;display:flex;flex-direction:column;min-width:0;background:#fff;border-right:2px solid #9ca3af}
  #palette{display:flex;gap:4px;padding:6px;background:#f3f4f6;border-bottom:1px solid var(--line);flex-wrap:wrap}
  #palette button{font:inherit;font-size:12px;font-weight:800;border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:6px 8px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:4px}
  #palette button kbd{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:#6b7280}
  #palette button:active{background:#dbeafe}
  #ladderWrap{flex:1;overflow:auto;position:relative;background:#fff;outline:none}
  #ladder{display:block}
  #statusBar{border-top:1px solid var(--line);padding:6px 10px;font-size:12.5px;min-height:34px;background:#f9fafb;max-height:96px;overflow:auto}
  #statusBar .err{color:var(--warn);font-weight:800;cursor:pointer}
  #statusBar .ok{color:var(--on);font-weight:800}
  #simPane{flex:1;display:flex;flex-direction:column;min-width:0;background:#0f1419}
  #simFrame{flex:1;border:0;width:100%;min-height:0;background:#dfe5ec}
  #opPanel{display:flex;gap:6px;padding:8px;background:#fff;align-items:center;flex-wrap:wrap}
  .pb{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-size:15px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);user-select:none;-webkit-user-select:none;touch-action:none}
  .pb small{font-size:11px;margin-left:4px;opacity:.9}
  .pb.start{background:#15803d} .pb.stop{background:#b91c1c} .pb.reset{background:#374151}
  .pb.down{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  #main.detached #simPane{display:none} #main.detached #edPane{border-right:0}
  #detachBar{display:none;align-items:center;gap:8px;padding:6px 10px;background:#fef3c7;font-size:13px;font-weight:800;color:#92400e;border-bottom:1px solid #fcd34d}
  #main.detached ~ #x, .detached #detachBar{display:flex}
  #simAlarm{color:var(--warn);font-size:13px;font-weight:900;flex:1;min-width:120px}
  #inputBox{position:absolute;display:none;z-index:20;background:#fff;border:2px solid var(--accent);border-radius:10px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);width:300px}
  #inputBox .ttl{font-size:12px;color:var(--sub);margin-bottom:4px}
  #inputBox input{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:16px;font-weight:800;padding:6px 8px;border:2px solid var(--line);border-radius:6px}
  #inputBox .hint{font-size:11.5px;color:#6b7280;margin-top:4px;line-height:1.5}
  #inputBox .err{font-size:12px;color:var(--warn);margin-top:4px;font-weight:800}
  #inputBox .row{display:flex;gap:6px;margin-top:6px}
  #inputBox button{flex:1;font:inherit;font-size:13px;font-weight:800;border:0;border-radius:6px;padding:7px;cursor:pointer}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
  #modal .card{background:#fff;border-radius:14px;padding:14px;width:min(640px,94vw);max-height:90vh;overflow:auto}
  #modal h2{font-size:16px;margin-bottom:8px}
  #modal textarea{width:100%;height:240px;font-family:ui-monospace,Consolas,monospace;font-size:12px;border:2px solid var(--line);border-radius:8px;padding:8px}
  #modal .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  #modal button{font:inherit;font-size:13px;font-weight:800;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:#e5e7eb}
  #modal button.primary{background:#2563eb;color:#fff}
  #modal p{font-size:13px;line-height:1.7;color:var(--sub)}
  #taskBar{display:none;align-items:center;gap:8px;padding:6px 10px;background:#fff7ed;font-size:13px;font-weight:800;color:#7c2d12;border-bottom:2px solid #f59e0b;line-height:1.5}
  #taskBar.on{display:flex}
  #edTabs{display:none;gap:4px;padding:5px 6px 0;background:#e5e7eb;border-bottom:1px solid #cbd5e1}
  #edTabs.has{display:flex}
  #edTabs button{font:inherit;font-size:13px;font-weight:900;border:1px solid #cbd5e1;border-bottom:0;background:#f3f4f6;color:var(--sub);border-radius:8px 8px 0 0;padding:6px 16px;cursor:pointer}
  #edTabs button.sel{background:#fff;color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
  #ladderArea{flex:1;position:relative;display:flex;min-height:0}
  #edPane.docs #palette, #edPane.docs #ladderArea{display:none}
  #docsPane{display:none;flex:1;min-height:0;flex-direction:column;background:#fff}
  #edPane.docs #docsPane{display:flex}
  #docTabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:#f9fafb;flex-wrap:wrap}
  #docTabs button{font:inherit;font-size:13px;font-weight:800;border:2px solid #cbd5e1;background:#fff;color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
  #docTabs button.sel{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
  #docBody{flex:1;overflow:auto;padding:12px 16px 28px;font-size:13.5px;line-height:1.75;color:var(--ink)}
  #docBody h2{font-size:17px;font-weight:900;margin-bottom:4px}
  #docBody h3{font-size:14px;font-weight:900;margin:16px 0 6px;color:#1e3a8a;border-left:4px solid var(--accent);padding-left:8px}
  #docBody .lead{color:var(--sub);margin-bottom:4px}
  #docBody .tip{font-size:12.5px;color:var(--sub);margin-bottom:6px}
  #docBody table{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0}
  #docBody th,#docBody td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
  #docBody th{background:#f3f4f6;color:var(--sub);font-size:12.5px;white-space:nowrap}
  #docBody td.k{white-space:nowrap;color:var(--sub);width:7em}
  #docBody ul{padding-left:20px;margin:4px 0}
  #docBody .notes{background:#eff6ff;border-left:4px solid var(--accent);padding:6px 10px;margin:6px 0;border-radius:6px}
  #docBody .dev{font-family:ui-monospace,Consolas,monospace;font-weight:900;color:#0b3d91;cursor:pointer;border-bottom:1px dotted #0b3d91}
  #docBody .dev:hover{background:#dbeafe}
  #docBody svg .dev{fill:#0b3d91;border:0;text-decoration:underline}
  #docBody svg{display:block;max-width:100%;height:auto;margin:6px auto}
  #findBox{position:absolute;right:14px;top:8px;z-index:15;width:min(340px,92%);background:#fff;border:2px solid var(--accent);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:8px;display:none}
  #findBox .fRow{display:flex;gap:6px;align-items:center}
  #findIn{flex:1;min-width:0;font-family:ui-monospace,Consolas,monospace;font-size:15px;font-weight:800;padding:5px 8px;border:2px solid var(--line);border-radius:6px}
  #findBox .fRow button{font:inherit;font-size:12.5px;font-weight:800;border:0;border-radius:6px;padding:7px 10px;cursor:pointer;background:#e5e7eb;color:var(--ink)}
  #findBox .fRow button.go{background:#2563eb;color:#fff}
  #findMsg{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.5}
  #findRes{max-height:250px;overflow:auto;margin-top:4px}
  .fHit{display:flex;gap:8px;width:100%;text-align:left;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:5px 7px;margin-top:4px;cursor:pointer}
  .fHit:hover{background:#f3f4f6} .fHit.sel{border-color:#2563eb;background:#eff6ff}
  .fHit .k{min-width:4.5em;color:#92400e;font-weight:900} .fHit .n{min-width:4em;font-family:ui-monospace,Consolas,monospace}
  #mTabs{display:none}
  @media (max-width: 900px){
    #mTabs{display:flex;background:#111827;padding:0 6px 6px;gap:6px}
    #mTabs button{flex:1;font:inherit;font-size:14px;font-weight:900;border:0;border-radius:8px;padding:8px;background:#374151;color:#fff}
    #mTabs button.sel{background:#fff;color:#111}
    #main{flex-direction:column}
    #edPane,#simPane{flex:1;border-right:0}
    #main.showSim #edPane{display:none} #main:not(.showSim) #simPane{display:none}
    #bDetach{display:none}
    #top h1{width:100%}
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1>ブラウザPLC ラダーエディタ</h1>
    <select id="lineSel"><option value="1">ライン1：搬送・押出し</option><option value="2" selected>ライン2：ロボット＋プレス</option><option value="3">ライン3：インデックス組立機</option></select>
    <button class="tb" id="bFile">ファイル</button>
    <button class="tb" id="bConvert">変換 F4</button>
    <button class="tb primary" id="bWrite">PLCへ書き込み</button>
    <button class="tb" id="bRun">RUN</button>
    <button class="tb" id="bMon">モニタ F3</button>
    <button class="tb" id="bDetach" title="2画面の人向け：3Dラインを別ウィンドウに出します">3Dを別ウィンドウへ</button>
    <a class="tb" id="bHelp" href="tutorial.html" target="_blank" rel="noopener" style="text-decoration:none">使い方</a>
    <span class="sp"></span>
    <span id="plcState">STOP（未書込み）</span>
  </div>
  <div id="mTabs"><button data-t="ed" class="sel">ラダー</button><button data-t="sim">3Dライン</button></div>
  <div id="kunrenBar" data-tour="kunren-bar"></div>
  <div id="main">
    <div id="edPane">
      <div id="detachBar">3Dラインは別ウィンドウで動いています<span id="detachInfo" style="font-weight:700"></span><button class="tb" id="bAttach" style="margin-left:auto;background:#92400e">元に戻す</button></div>
      <div id="taskBar" data-tour="task-bar"><span>課題の回路を開いています：<b id="taskName"></b>。直したら「PLCへ書き込み」をして、3Dの「トラブル練習」から10個流して確かめます。</span></div>
      <div id="edTabs" data-tour="docs-tab"><button data-v="ladder" class="sel">ラダー</button><button data-v="docs">資料</button></div>
      <div id="palette">
        <button data-op="a">a接点<kbd>F5</kbd></button>
        <button data-op="b">b接点<kbd>F6</kbd></button>
        <button data-op="pa">並列a<kbd>⇧F5</kbd></button>
        <button data-op="pb">並列b<kbd>⇧F6</kbd></button>
        <button data-op="coil">コイル<kbd>F7</kbd></button>
        <button data-op="inst">命令<kbd>F8</kbd></button>
        <button data-op="h">横線<kbd>F9</kbd></button>
        <button data-op="v">縦線<kbd>⇧F9</kbd></button>
        <button data-op="del">削除<kbd>Del</kbd></button>
        <button data-op="insRow">行挿入<kbd>⇧Ins</kbd></button>
        <button data-op="delRow">行削除<kbd>⇧Del</kbd></button>
        <button data-op="cmt">コメント</button>
        <button data-op="find" data-tour="find">検索<kbd>Ctrl+F</kbd></button>
        <button data-op="zoomOut">－</button><button data-op="zoomIn">＋</button>
      </div>
      <div id="ladderArea">
      <div id="findBox" data-tour="find-box">
        <div class="fRow"><input id="findIn" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="デバイス（例 M175）"><button class="go" id="findGo">検索</button><button id="findClose">閉じる</button></div>
        <div id="findMsg"></div>
        <div id="findRes"></div>
      </div>
      <div id="ladderWrap" tabindex="0">
        <svg id="ladder" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="inputBox">
          <div class="ttl" id="ibTitle">回路入力</div>
          <input id="ibInput" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <div class="err" id="ibErr"></div>
          <div class="hint" id="ibHint"></div>
          <div class="row"><button id="ibOk" style="background:#2563eb;color:#fff">OK（Enter）</button><button id="ibCancel" style="background:#e5e7eb">キャンセル（Esc）</button></div>
        </div>
      </div>
      </div>
      <div id="docsPane" data-tour="docs-pane"><div id="docTabs"></div><div id="docBody"></div></div>
      <div id="kunrenPane" data-tour="kunren-pane"></div>
      <div id="statusBar"></div>
    </div>
    <div id="simPane">
      <iframe id="simFrame" title="3Dライン"></iframe>
      <div id="opPanel">
        <button class="pb start" id="pStart">起動<small id="dStart">X0</small></button>
        <button class="pb stop" id="pStop">停止<small id="dStop">X1</small></button>
        <button class="pb reset" id="pReset">リセット<small id="dReset">X2</small></button>
        <span id="simAlarm"></span>
      </div>
    </div>
  </div>
</div>
<div id="modal"><div class="card" id="modalCard"></div></div>
