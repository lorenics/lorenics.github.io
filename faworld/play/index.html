<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="fai/factory_en.js"></script>
<title>FA World by Lorenics</title>
<link rel="stylesheet" href="fai/fonts/zen.css">
<style>
/* 全画面の俯瞰3D。左上に題と凡例、右下に視点の切り替え。夕方の始まりの工場、中は暖色の照明。 */
:root{
  --bg:#0b1016; --fg:#eaf0f5; --muted:#9fb0bf; --panel:rgba(12,17,23,.84); --line:rgba(255,255,255,.14);
  --accent:#ffb627; --ok:#3ad18f;
  --font-ui:"Zen Kaku Gothic New",sans-serif;
  --font-num:"Consolas","Roboto Mono",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);overflow:hidden}
#app{position:fixed;inset:0;background:var(--bg)}
#app canvas{display:block}
#labels{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.zl{background:rgba(8,12,16,.8);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:3px 9px;font-size:13px;white-space:nowrap;letter-spacing:.02em;font-family:var(--font-ui)}
.zl b{color:var(--accent);font-family:var(--font-num);margin-right:6px}
.zl{transition:opacity .15s}
.zl.off{opacity:0}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.5) 100%)}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);padding:12px 14px;max-width:min(420px,calc(100vw - 32px));font-size:13px;line-height:1.5;box-sizing:border-box;z-index:3}
#hud{left:max(16px,env(safe-area-inset-left,0px));top:max(16px,env(safe-area-inset-top,0px));width:min(440px,calc(100vw - 32px));max-width:none;overflow:auto;overscroll-behavior:contain}
#hud .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
#hud h1{margin:0;font-size:18px;letter-spacing:.04em;cursor:pointer}
#btnList{flex:none;padding:4px 10px}
#hudBody{margin-top:4px}
#hud.closed #hudBody{display:none}
#hud .sub{color:var(--muted);margin:0 0 8px;font-size:12px;word-break:keep-all;overflow-wrap:anywhere}
#hud .prod{margin:0 0 10px;font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
#hud .prod dt{color:var(--muted);white-space:nowrap}
#hud .prod dd{margin:0;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
#hud .prod b{color:var(--accent);font-weight:400}
#legend{list-style:none;margin:0;padding:8px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
#legend li{display:grid;grid-template-columns:1.7em 1fr;column-gap:6px;align-items:baseline;min-width:0}
#legend li span{min-width:0;overflow-wrap:anywhere}
#legend small{display:block;color:var(--muted);font-size:12px;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
#legend b{color:var(--accent);font-family:var(--font-num);text-align:right}
#ctl{right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:min(460px,calc(100vw - 32px))}
button{font:inherit;font-size:12px;color:var(--fg);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
button:hover{background:rgba(255,255,255,.12)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:#1a1200;border-color:var(--accent)}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;background:var(--bg);z-index:5}
#err{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);color:#ffb4a8;font-size:13px;display:none;text-align:center;z-index:6}
/* 札と一覧は押せる（押すとその工程へ寄って説明を出す） */
.zl{pointer-events:auto;cursor:pointer}
.zl.off{pointer-events:none}
.zl.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#legend li{cursor:pointer;border-radius:6px;padding:1px 4px;margin:0 -4px}
#legend li:hover,#legend li:focus-visible{background:rgba(255,255,255,.08);outline:none}
#legend .tag{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-size:11.5px;font-style:normal;line-height:1.5;vertical-align:1px}
/* 工程の説明の枠（一覧と入れ替わる） */
#card{display:none}
#hud.card #card{display:block}
#hud.card .sub,#hud.card .prod,#hud.card #legend{display:none}
#card .ctop{display:flex;align-items:center;gap:8px;margin:6px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
#card .ctop .no{color:var(--accent);font-family:var(--font-num);font-size:18px;line-height:1}
#card h2{margin:0;font-size:16px;line-height:1.35;flex:1;min-width:0}
#card .do{margin:0 0 4px;font-size:13.5px}
#card h3{margin:12px 0 6px;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.04em}
#card .mv{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:0 0 8px}
#card .mv b{display:block;font-size:13.5px}
#card .mv p{margin:2px 0 0;font-size:13px;display:grid;grid-template-columns:2.4em 1fr;gap:6px}
#card .mv .k{color:var(--muted);font-size:12px}
#card .look{margin:0;font-size:13px}
#card .simBox{margin-top:12px;padding:10px 12px;border:1px solid rgba(255,182,39,.5);border-radius:8px;background:rgba(255,182,39,.08)}
#card .simBox p{margin:8px 0 0;font-size:12.5px}
.simBtn{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:700;font-size:13px;padding:8px 14px}
.simBtn:hover{background:#ffc552}
#card .nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
#tip{position:fixed;z-index:4;pointer-events:none;background:rgba(8,12,16,.92);color:#fff;border:1px solid var(--accent);border-radius:6px;padding:4px 10px;font-size:13px;display:none;white-space:nowrap}
/* シミュレーター（全画面で重ねる） */
#sim{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
#sim[hidden]{display:none}
#sim .bar{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:#10161d}
#sim .bar b{font-size:14px;white-space:nowrap}
#sim .bar span{color:var(--muted);font-size:12.5px;flex:1;min-width:0}
#sim iframe{flex:1;width:100%;border:0;background:#fff}
@media (max-width:520px){
  #legend{grid-template-columns:1fr}
  #sim .bar span{display:none}
}

<div id="app">
  <div id="labels"></div>
  <div id="vignette"></div>
  <div id="loading">工場を組み立てています…</div>
  <div id="err"></div>
  <section id="hud" class="panel" aria-label="凡例">
    <div class="hd"><h1 id="ttl">FA World by Lorenics</h1><button id="btnList" aria-expanded="true" aria-controls="hudBody">一覧を閉じる</button></div>
    <div id="hudBody">
      <p class="sub">左ドラッグで回す・<wbr>ホイールで寄る・<wbr>右ドラッグで動かす</p>
      <dl class="prod">
        <dt>作る物</dt><dd><b>スポーツカー</b>（1日数台）</dd>
        <dt>1号棟</dt><dd>エンジンとギアボックス：<wbr>削る→<wbr>焼入れ→<wbr>研削→<wbr>検査→<wbr>組む→<wbr>試す</dd>
        <dt>2号棟</dt><dd>車：<wbr>プレス→<wbr>車体溶接→<wbr>塗装→<wbr>組立→<wbr>完成車検査→<wbr>出荷</dd>
      </dl>
      <ul id="legend"></ul>
      <div id="card" aria-live="polite"></div>
    </div>

  <div id="tip"></div>
